server:
  port: ${PORT:8080}
  servlet:
    context-path: /

spring:
  application:
    name: smart-assessment-platform
  profiles:
    active: dev

  # Default datasource: H2 in MySQL mode (Zero external setup required for quick evaluation)
  datasource:
    url: jdbc:h2:mem:smart_assessment_db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MySQL
    driver-class-name: org.h2.Driver
    username: sa
    password: 

  h2:
    console:
      enabled: true
      path: /h2-console
      settings:
        web-allow-others: true

  sql:
    init:
      mode: never

  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true

# JWT Configuration
app:
  jwt:
    # 256-bit base64-encoded secret key
    secret: 404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
    expiration-milliseconds: 86400000 # 24 hours
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173,https://smart-assessment-platform-five.vercel.app,https://*.vercel.app}

logging:
  level:
    com.smartassessment: INFO
    org.springframework.security: INFO
    org.hibernate.SQL: WARN
