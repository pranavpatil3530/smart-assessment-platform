version: '3.8'

services:
  # MySQL 8.0 Database (Optional production DB)
  mysql-db:
    image: mysql:8.0
    container_name: assessment-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: smart_assessment_db
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - assessment-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Spring Boot Backend API
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: assessment-backend
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=dev
      # For MySQL mode, uncomment below:
      # - SPRING_PROFILES_ACTIVE=mysql
      # - DB_HOST=mysql-db
      # - DB_PORT=3306
      # - DB_NAME=smart_assessment_db
      # - DB_USERNAME=root
      # - DB_PASSWORD=root
    networks:
      - assessment-network
    depends_on:
      mysql-db:
        condition: service_healthy

  # React Frontend (Nginx)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: assessment-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    networks:
      - assessment-network
    depends_on:
      - backend

volumes:
  mysql_data:

networks:
  assessment-network:
    driver: bridge
